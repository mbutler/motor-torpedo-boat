<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTB</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="table">
<header class="rail">
<div class="title-block"><span class="title">MTB</span><span class="subtitle">Motor torpedo boats</span></div>
<div class="move-block"><span class="move-label">Move</span><span id="turn-number">1</span><span class="move-total">/ 10</span><span id="phase-name">Setup</span></div>
<div class="chart-tools"><button id="zoom-out" type="button" aria-label="Zoom out">−</button><span id="zoom-label">100%</span><button id="zoom-in" type="button" aria-label="Zoom in">+</button></div>
</header>
<main id="game-container">
<section class="chart-panel" aria-label="Battle chart">
<div id="chart-viewport"><canvas id="game-canvas" width="1600" height="1200" aria-label="Battlefield. Select a counter to issue orders."></canvas></div>
</section>
<aside id="ui-panel">
<div class="pad">
<p id="phase-help"></p>
<label><span>Side</span><select id="view-faction"><option value="British">British</option><option value="German">German</option></select></label>
<label><span>Vessel</span><select id="fleet-select"></select></label>
<p id="selection-hint">Select a counter on the chart.</p>
<div id="controls">
<div id="ship-orders" class="hidden">
<div class="vessel-heading"><img id="vessel-art" alt="Selected counter"><div><h3 id="selected-ship-name">Select a ship</h3>
<svg id="hull-gauge" viewBox="0 0 260 18" role="img" aria-label="Remaining buoyancy"><text x="0" y="12" font-size="9" font-family="Courier New, monospace">BUOYANCY</text><rect x="87" y="4" width="170" height="8" fill="none" stroke="currentColor"/><rect id="buoyancy-fill" x="88" y="5" width="168" height="6" fill="#1c2826"/></svg>
</div></div>
<p id="ship-status"></p>
<fieldset class="helm"><legend>Course</legend>
<label><span>Speed</span><span class="input-unit"><input type="number" id="speed-input" min="0" max="40"><small>kn</small></span></label>
<label><span>Turn</span><span class="input-unit"><input type="number" id="turn-input" min="-9" max="9" value="0"><small>pts</small></span></label>
<p class="field-note">− port, + starboard.</p>
<label><span>Turn at</span><select id="turn-timing"><option value="START">Start of move</option><option value="END">End of move</option></select></label>
<label class="check-label"><input id="ram-order" type="checkbox"> Intentional ram</label>
</fieldset>
<fieldset class="weapons"><legend>Weapons</legend>
<p class="field-note">Select an enemy counter to aim.</p>
<div class="attack-row"><span>Guns</span><button id="fire-btn" type="button">Fire</button></div>
<div class="attack-row"><span>Torpedoes</span><span class="line-controls"><select id="torpedo-count" aria-label="Torpedo salvo"><option value="1">1</option><option value="2">2</option></select><button id="torpedo-btn" type="button">Launch</button></span></div>
<div class="attack-row"><span>Charges</span><span class="line-controls"><select id="dc-depth-select" aria-label="Depth charge depth"><option value="SHALLOW">Shallow</option><option value="DEEP">Deep</option></select><button id="depth-btn" type="button">Drop</button></span></div>
<div class="attack-row"><span>Sighting</span><button id="sight-btn" type="button">Attempt</button></div>
<div class="attack-row"><span>Starshell</span><button id="illum-btn" type="button">Illuminate</button></div>
<button id="cancel-attacks" class="quiet" type="button">Cancel attack orders</button>
</fieldset>
</div>
</div>
<details class="battle-settings" open><summary>Setup</summary>
<label><span>Scenario</span><select id="scenario-select"><option value="GERMAN_CONVOY">German convoy</option><option value="BRITISH_CONVOY">British convoy</option><option value="ENCOUNTER">Warship encounter</option></select></label>
<label><span>Visibility</span><select id="visibility-select"><option value="CLEAR">Clear</option><option value="MIST">Mist</option><option value="FOG">Fog</option><option value="NIGHT">Night</option></select></label>
<label><span>Omit transport</span><select id="omitted-transport"><option value="4">4</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
<div id="setup-controls">
<p class="field-note">Select a vessel, then click its starting position.</p>
<label><span>Heading</span><span class="input-unit"><input id="setup-heading" type="number" min="0" max="359" value="0"><small>°</small></span></label>
<button id="place-british-patch" type="button">Place British patch</button>
<button id="place-german-patch" type="button">Place German patch</button>
</div>
<button id="new-game-btn" class="quiet" type="button">New battle</button>
</details>
<button id="next-phase-btn" type="button">Begin battle</button>
<div class="log-label">Log</div>
<div id="log" role="log" aria-live="polite"></div>
</div>
</aside>
</main>
</div>
<script src="mtb_data.js"></script>
<script src="mtb_rules.js"></script>
<script src="mtb_visuals.js"></script>
<script src="mtb_game.js"></script>
</body>
</html>
